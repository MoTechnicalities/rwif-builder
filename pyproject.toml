[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rwif-builder"
version = "0.1.100"
description = "Build portable RWIF semantic-memory artifacts from local content"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MoTechnicalities" }]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.scripts]
rwif = "rwif_builder.cli:main"

[project.optional-dependencies]
audio-separation = [
  "torch>=2.10,<2.11",
  "torchaudio>=2.10,<2.11",
  "demucs>=4.0,<5",
]
transformers = [
  "torch>=2.2",
  "transformers>=4.39",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
