title: Listening room baseline
description: Baseline Level 3 ARWIF room-aware review example.
channel_layout: stereo
reference_frame: scene
listener_anchor:
  x: 0.0
  y: 1.2
  z: 0.0
room:
  dimensions:
    width_m: 10.0
    depth_m: 14.0
    height_m: 4.5
  geometry_reference:
    geometry_id: studio.a
    geometry_class: shoebox
  surface_profile: reflective
  surface_treatment:
    absorption: low
    diffusion: balanced
  reflection_policy:
    style: balanced
    early_reflections: natural
    late_reverb: controlled
  renderer_adaptation_hints:
    target_playback: multichannel_room
    spatial_priority: envelopment
    downmix_policy: preserve_positions
  listening_zones:
    - zone_id: sweet-spot
      anchor:
        x: 0.0
        y: 1.2
        z: 0.0
      radius_m: 1.5
      intent: focused
  speakers:
    - speaker_id: left-main
      anchor:
        x: -2.5
        y: 1.3
        z: 2.0
      channel: L
      role: main
    - speaker_id: right-main
      anchor:
        x: 2.5
        y: 1.3
        z: 2.0
      channel: R
      role: main
sample_rate_hz: 12000
default_duration_seconds: 0.5
states:
  - label: room-tone
    source_id: bell.near
    source_groups:
      - foreground
    position:
      x: -0.5
      y: 1.0
      z: 0.8
    oscillators:
      - hz: 261
        amplitude: 0.8